name: OpenChamber

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Select Tunnel Provider'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - ngrok
          - cloudflare
      timeout_minutes:
        description: 'Auto-shutdown after (minutes)'
        required: true
        default: '300'
        type: string

jobs:
  serve:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Clone All Your Repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          mkdir -p ~/repos
          cd ~/repos

          page=1
          while true; do
            batch=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/user/repos?per_page=100&page=$page&affiliation=owner")
            count=$(echo "$batch" | jq '. | length')
            if [ "$count" -eq 0 ]; then break; fi

            echo "$batch" | jq -r '.[].clone_url' | while read -r repo; do
              repo_name=$(basename "$repo" .git)
              if [ -d "$HOME/repos/$repo_name/.git" ]; then
                echo "$repo_name already exists, pulling latest..."
                cd "$HOME/repos/$repo_name"
                git pull --ff-only origin 2>/dev/null || true
                cd ~/repos
              else
                echo "Cloning $repo_name..."
                git clone https://$GH_TOKEN@${repo#https://} || true
              fi
            done

            page=$(( page + 1 ))
          done

          echo "All repos cloned. Total: $(ls ~/repos | wc -l)"

      # ============================================================
      # CACHE: Restore provider packages (~/.cache/opencode)
      # ============================================================
      - name: Restore Provider Package Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/opencode
          key: opencode-provider-cache-${{ runner.os }}
          restore-keys: |
            opencode-provider-cache-

      # ============================================================
      # PERSISTENCE: Restore previous session (DB, auth, config)
      # ============================================================
      - name: Restore Session Artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: opencode-session
          path: /tmp/opencode-restore
          workflow: opencode.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Restored Session Data
        run: |
          echo "=== RESTORE DEBUG ==="
          echo "Contents of /tmp/opencode-restore:"
          ls -la /tmp/opencode-restore/ 2>/dev/null || echo "Directory does not exist"

          if [ -d "/tmp/opencode-restore" ]; then
            mkdir -p ~/.config/opencode ~/.local/share/opencode

            # Restore config (theme, reasoning display, provider config)
            if [ -d "/tmp/opencode-restore/config" ]; then
              echo "Restoring config files..."
              cp -rv /tmp/opencode-restore/config/* ~/.config/opencode/ 2>/dev/null || true
            fi

            # Restore auth tokens
            if [ -f "/tmp/opencode-restore/auth.json" ]; then
              echo "Restoring auth.json..."
              cp -v /tmp/opencode-restore/auth.json ~/.local/share/opencode/auth.json 2>/dev/null || true
            fi

            # Restore SQLite database (main + WAL sidecar files)
            if [ -f "/tmp/opencode-restore/opencode.db" ]; then
              echo "Restoring opencode.db..."
              cp -v /tmp/opencode-restore/opencode.db ~/.local/share/opencode/opencode.db 2>/dev/null || true
            fi
            if [ -f "/tmp/opencode-restore/opencode.db-wal" ]; then
              cp -v /tmp/opencode-restore/opencode.db-wal ~/.local/share/opencode/opencode.db-wal 2>/dev/null || true
            fi
            if [ -f "/tmp/opencode-restore/opencode.db-shm" ]; then
              cp -v /tmp/opencode-restore/opencode.db-shm ~/.local/share/opencode/opencode.db-shm 2>/dev/null || true
            fi

            echo "Session restored successfully!"
          else
            echo "No previous session found. Fresh start."
          fi

      # ============================================================
      # SETUP: Node and tools
      # ============================================================
      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          npm install -g opencode-ai @openchamber/web
          # coreutils provides stdbuf to prevent log buffering during auth
          sudo apt update && sudo apt install jq lsof coreutils -y

          # Install ttyd for OpenCode TTY exposure
          wget -q -O ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.3/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/

      # ============================================================
      # CONFIGURATION: Write opencode.json (only if not restored)
      # ============================================================
      - name: Configure OpenCode
        run: |
          mkdir -p ~/.config/opencode

          # Only write config if restore did not bring one in
          if [ ! -f "$HOME/.config/opencode/opencode.json" ]; then
            echo "No restored config found. Writing default config..."
            cat << 'EOF' > ~/.config/opencode/opencode.json
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "noob": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Noob Router",
                "options": {
                  "baseURL": "https://noobrouterproduction.azurewebsites.net/v1",
                  "apiKey": "sk-gpt",
                  "reasoningEffort": "x-high",
                  "reasoningSummary": "detailed"
                },
                "models": {
                  "gpt-5.3-codex": {
                    "name": "GPT-5.3 Codex",
                    "limit": { "context": 272000, "output": 128000 }
                  },
                  "gpt-5.3-codex-spark": {
                    "name": "GPT-5.3 Codex Spark",
                    "limit": { "context": 272000, "output": 128000 }
                  },
                  "gpt-5.4": {
                    "name": "GPT-5.4",
                    "limit": { "context": 1048576, "output": 128000 }
                  }
                }
              }
            }
          }
          EOF
            echo "Config written."
          else
            echo "Restored config found. Skipping default write."
          fi

      # ============================================================
      # STARTUP: Launch services
      # ============================================================
      - name: Start Services
        run: |
          echo "Starting OpenCode TTY..."
          nohup stdbuf -oL ttyd -p 7681 opencode > opencode_tty.log 2>&1 &

          echo "Starting OpenChamber..."
          nohup stdbuf -oL openchamber --port 9090 > openchamber.log 2>&1 &

          echo "Starting OpenCode Web..."
          nohup stdbuf -oL opencode web --port 8080 > opencode_web.log 2>&1 &

          sleep 20

          echo "Services started. Checking status..."
          lsof -i :7681 || echo "Warning: OpenCode TTY may not be running"
          lsof -i :9090 || echo "Warning: OpenChamber may not be running"
          lsof -i :8080 || echo "Warning: OpenCode Web may not be running"

      - name: Setup Tunnel
        run: |
          if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
            curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update && sudo apt install ngrok -y
            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

            nohup ngrok http 127.0.0.1:9090 --log=stdout > tunnel_chamber.log 2>&1 &
            nohup ngrok http 127.0.0.1:8080 --log=stdout > tunnel_web.log 2>&1 &
            nohup ngrok http 127.0.0.1:7681 --log=stdout > tunnel_tty.log 2>&1 &
            sleep 10

            URL_CHAMBER=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("9090")) | .public_url')
            URL_WEB=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("8080")) | .public_url')
            URL_TTY=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("7681")) | .public_url')

            echo "URL_CHAMBER=$URL_CHAMBER" >> $GITHUB_ENV
            echo "URL_WEB=$URL_WEB" >> $GITHUB_ENV
            echo "URL_TTY=$URL_TTY" >> $GITHUB_ENV

          else
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb

            nohup cloudflared tunnel --url http://127.0.0.1:7681 > tunnel_tty.log 2>&1 &
            nohup cloudflared tunnel --url http://127.0.0.1:9090 > tunnel_chamber.log 2>&1 &
            nohup cloudflared tunnel --url http://127.0.0.1:8080 > tunnel_web.log 2>&1 &

            sleep 15

            URL_TTY=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_tty.log | tail -n 1)
            URL_CHAMBER=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_chamber.log | tail -n 1)
            URL_WEB=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_web.log | tail -n 1)

            echo "URL_TTY=$URL_TTY" >> $GITHUB_ENV
            echo "URL_CHAMBER=$URL_CHAMBER" >> $GITHUB_ENV
            echo "URL_WEB=$URL_WEB" >> $GITHUB_ENV
          fi

      # ============================================================
      # MONITOR: Self-healing loop with status updates
      # ============================================================
      - name: Monitor & Self-Heal
        run: |
          echo "------------------------------------------"
          echo "OPENCHAMBER : ${{ env.URL_CHAMBER }}"
          echo "OPENCODE WEB: ${{ env.URL_WEB }}"
          echo "OPENCODE TTY: ${{ env.URL_TTY }}"
          echo "AUTO-SHUTDOWN IN: ${{ github.event.inputs.timeout_minutes }} minute(s)"
          echo "------------------------------------------"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$(( ${{ github.event.inputs.timeout_minutes }} * 60 ))

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( TIMEOUT_SECONDS - ELAPSED ))

            if [ $REMAINING -le 0 ]; then
              echo "[$(date)] Timeout reached. Initiating graceful shutdown..."
              pkill -f "opencode|openchamber|ttyd|ngrok|cloudflared" 2>/dev/null || true
              break
            fi

            if [ $(( ELAPSED % 300 )) -lt 10 ]; then
              echo "[$(date)] Time remaining: $(( REMAINING / 60 )) minutes"
            fi

            if ! lsof -i :9090 > /dev/null; then
              echo "[$(date)] Restoring OpenChamber..."
              nohup stdbuf -oL openchamber --port 9090 >> openchamber.log 2>&1 &
              sleep 10
            fi

            if ! lsof -i :8080 > /dev/null; then
              echo "[$(date)] Restoring OpenCode Web..."
              nohup stdbuf -oL opencode web --port 8080 >> opencode_web.log 2>&1 &
              sleep 10
            fi

            if ! lsof -i :7681 > /dev/null; then
              echo "[$(date)] Restoring OpenCode TTY..."
              nohup stdbuf -oL ttyd -p 7681 opencode >> opencode_tty.log 2>&1 &
              sleep 10
            fi

            if ! pgrep -f "ngrok|cloudflared" > /dev/null; then
              echo "[$(date)] Re-hosting tunnels..."
              if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
                nohup ngrok http 127.0.0.1:9090 --log=stdout > tunnel_chamber.log 2>&1 &
                nohup ngrok http 127.0.0.1:8080 --log=stdout > tunnel_web.log 2>&1 &
                nohup ngrok http 127.0.0.1:7681 --log=stdout > tunnel_tty.log 2>&1 &
                sleep 10
                echo "NEW CHAMBER: $(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("9090")) | .public_url')"
                echo "NEW WEB   : $(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("8080")) | .public_url')"
                echo "NEW TTY   : $(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr | contains("7681")) | .public_url')"
              else
                nohup cloudflared tunnel --url http://127.0.0.1:7681 > tunnel_tty.log 2>&1 &
                nohup cloudflared tunnel --url http://127.0.0.1:9090 > tunnel_chamber.log 2>&1 &
                nohup cloudflared tunnel --url http://127.0.0.1:8080 > tunnel_web.log 2>&1 &
                sleep 15
                echo "NEW CHAMBER: $(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_chamber.log | tail -n 1)"
                echo "NEW WEB   : $(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_web.log | tail -n 1)"
                echo "NEW TTY   : $(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel_tty.log | tail -n 1)"
              fi
            fi

            tail -n 1 openchamber.log

            # Check all repos for remote updates and pull if changed
            for repo_dir in ~/repos/*/; do
              if [ -d "$repo_dir/.git" ]; then
                cd "$repo_dir"
                git fetch origin --quiet 2>/dev/null || true
                LOCAL=$(git rev-parse HEAD 2>/dev/null)
                REMOTE=$(git rev-parse "@{u}" 2>/dev/null)
                if [ "$LOCAL" != "$REMOTE" ] && [ -n "$REMOTE" ]; then
                  echo "[$(date)] Update detected in $(basename $repo_dir), pulling..."
                  git pull --rebase origin 2>/dev/null || true
                fi
                cd ~/repos
              fi
            done

            sleep 5
          done

      # ============================================================
      # PERSISTENCE: Save session data (always runs)
      # ============================================================
      - name: Prepare Session Data for Save
        if: always()
        run: |
          echo "Preparing session data..."
          mkdir -p /tmp/opencode-save/config

          # Save ~/.config/opencode (theme, reasoning prefs, provider config)
          if [ -d "$HOME/.config/opencode" ] && [ "$(ls -A $HOME/.config/opencode 2>/dev/null)" ]; then
            cp -rv $HOME/.config/opencode/* /tmp/opencode-save/config/ 2>/dev/null || true
            echo "Config saved: $(ls /tmp/opencode-save/config/ | wc -l) files"
          else
            echo "No config data to save"
          fi

          # Save auth tokens
          if [ -f "$HOME/.local/share/opencode/auth.json" ]; then
            cp -v $HOME/.local/share/opencode/auth.json /tmp/opencode-save/auth.json 2>/dev/null || true
            echo "Auth saved"
          else
            echo "No auth.json found"
          fi

          # Save SQLite database + WAL sidecar files
          for f in opencode.db opencode.db-wal opencode.db-shm; do
            if [ -f "$HOME/.local/share/opencode/$f" ]; then
              cp -v $HOME/.local/share/opencode/$f /tmp/opencode-save/$f 2>/dev/null || true
              echo "$f saved: $(du -sh $HOME/.local/share/opencode/$f | cut -f1)"
            fi
          done

          TOTAL=$(find /tmp/opencode-save -type f | wc -l)
          if [ "$TOTAL" -gt 0 ]; then
            echo "Session data ready: $TOTAL files total"
            ls -lah /tmp/opencode-save/
          else
            echo "Nothing to save. Creating placeholder."
            echo "$(date): No session data available" > /tmp/opencode-save/placeholder.txt
          fi

      - name: Upload Session Data (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session
          path: /tmp/opencode-save/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
