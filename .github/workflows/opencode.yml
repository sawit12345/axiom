name: OpenChamber

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: "Select Tunnel Provider"
        required: true
        default: "ngrok"
        type: choice
        options:
          - ngrok
          - cloudflare
      timeout_minutes:
        description: "Auto-shutdown after (minutes)"
        required: true
        default: "300"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    env:
      EVOLVEX_API_KEY: ${{ secrets.EVOLVEX_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Git with Your Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Clone All Your Repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/repos"
          cd "$HOME/repos"

          repos=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&affiliation=owner" \
            | jq -r '.[].clone_url')

          for repo in $repos; do
            echo "Cloning $repo..."
            git clone "https://$GH_TOKEN@${repo#https://}" || true
          done

      # ============================================================
      # PERSISTENCE: Restore previous session (OAuth tokens, accounts)
      # ============================================================
      - name: Restore Session Data (Artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: opencode-session
          path: /tmp/opencode-restore
          workflow: opencode.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Restored Session Data
        run: |
          echo "=== RESTORE DEBUG ==="
          echo "Contents of /tmp/opencode-restore:"
          ls -la /tmp/opencode-restore/ 2>/dev/null || echo "Directory does not exist"

          if [ -d "/tmp/opencode-restore" ]; then
            echo "Found restore directory, checking contents..."
            find /tmp/opencode-restore -type f 2>/dev/null || echo "No files found"

            mkdir -p "$HOME/.config/opencode" \
                     "$HOME/.config/opencode/plugins" \
                     "$HOME/.local/share/opencode/project" \
                     "$HOME/.local/state/opencode" \
                     "$HOME/.config/openchamber" \
                     "$HOME/.config/opencode-worktree" \
                     "$HOME/.local/share/opencode/worktree" \
                     "$HOME/.local/share/opencode/bin" \
                     "$HOME/.local/share/opencode/log" \
                     "$HOME/.cache/opencode" \
                     "$HOME/.config/oh-my-openagent" \
                     "$HOME/.config/oh-my-opencode" \
                     "$HOME/.local/share/oh-my-openagent" \
                     "$HOME/.local/share/oh-my-opencode" \
                     "$HOME/.cache/oh-my-openagent" \
                     "$HOME/.cache/oh-my-opencode" \
                     "$HOME/.oh-my-openagent" \
                     "$HOME/.oh-my-opencode"

            if [ -d "/tmp/opencode-restore/config" ]; then
              echo "Restoring OpenCode config files..."
              cp -rv /tmp/opencode-restore/config/* "$HOME/.config/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/openchamber" ]; then
              echo "Restoring OpenChamber config files..."
              cp -rv /tmp/opencode-restore/openchamber/* "$HOME/.config/openchamber/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/opencode-worktree" ]; then
              echo "Restoring Worktree config files..."
              cp -rv /tmp/opencode-restore/opencode-worktree/* "$HOME/.config/opencode-worktree/" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/auth.json" ]; then
              echo "Restoring auth.json..."
              cp -v /tmp/opencode-restore/auth.json "$HOME/.local/share/opencode/auth.json" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/opencode.db" ]; then
              echo "Restoring SQLite database..."
              cp -v /tmp/opencode-restore/opencode.db* "$HOME/.local/share/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/state" ]; then
              echo "Restoring state directory..."
              cp -rv /tmp/opencode-restore/state/* "$HOME/.local/state/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/project" ]; then
              echo "Restoring project sessions..."
              cp -rv /tmp/opencode-restore/project/* "$HOME/.local/share/opencode/project/" 2>/dev/null || true
              echo "Sessions restored: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/worktree" ]; then
              echo "Restoring git worktrees..."
              cp -rv /tmp/opencode-restore/worktree/* "$HOME/.local/share/opencode/worktree/" 2>/dev/null || true
              echo "Worktrees restored: $(find "$HOME/.local/share/opencode/worktree" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/cache" ]; then
              echo "Restoring cache..."
              cp -rv /tmp/opencode-restore/cache/* "$HOME/.cache/opencode/" 2>/dev/null || true
              echo "Cache restored: $(find "$HOME/.cache/opencode" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/log" ]; then
              echo "Restoring logs..."
              cp -rv /tmp/opencode-restore/log/* "$HOME/.local/share/opencode/log/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/bin" ]; then
              echo "Restoring bin directory..."
              cp -rv /tmp/opencode-restore/bin/* "$HOME/.local/share/opencode/bin/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/storage" ]; then
              echo "Restoring legacy storage..."
              mkdir -p "$HOME/.local/share/opencode/storage"
              cp -rv /tmp/opencode-restore/storage/* "$HOME/.local/share/opencode/storage/" 2>/dev/null || true
            fi

            # Restore Oh My OpenAgent / legacy Oh My OpenCode files explicitly.
            # These are separate from OpenCode's own config/cache in some installs.
            if [ -d "/tmp/opencode-restore/omo/config-opencode" ]; then
              echo "Restoring OmO config files under ~/.config/opencode..."
              cp -rv /tmp/opencode-restore/omo/config-opencode/* "$HOME/.config/opencode/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/config-oh-my-openagent" ]; then
              echo "Restoring ~/.config/oh-my-openagent..."
              cp -rv /tmp/opencode-restore/omo/config-oh-my-openagent/* "$HOME/.config/oh-my-openagent/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/config-oh-my-opencode" ]; then
              echo "Restoring ~/.config/oh-my-opencode..."
              cp -rv /tmp/opencode-restore/omo/config-oh-my-opencode/* "$HOME/.config/oh-my-opencode/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/local-share-oh-my-openagent" ]; then
              echo "Restoring ~/.local/share/oh-my-openagent..."
              cp -rv /tmp/opencode-restore/omo/local-share-oh-my-openagent/* "$HOME/.local/share/oh-my-openagent/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/local-share-oh-my-opencode" ]; then
              echo "Restoring ~/.local/share/oh-my-opencode..."
              cp -rv /tmp/opencode-restore/omo/local-share-oh-my-opencode/* "$HOME/.local/share/oh-my-opencode/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/cache-oh-my-openagent" ]; then
              echo "Restoring ~/.cache/oh-my-openagent..."
              cp -rv /tmp/opencode-restore/omo/cache-oh-my-openagent/* "$HOME/.cache/oh-my-openagent/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/cache-oh-my-opencode" ]; then
              echo "Restoring ~/.cache/oh-my-opencode..."
              cp -rv /tmp/opencode-restore/omo/cache-oh-my-opencode/* "$HOME/.cache/oh-my-opencode/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/manual-oh-my-openagent" ]; then
              echo "Restoring ~/.oh-my-openagent..."
              cp -rv /tmp/opencode-restore/omo/manual-oh-my-openagent/* "$HOME/.oh-my-openagent/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/manual-oh-my-opencode" ]; then
              echo "Restoring ~/.oh-my-opencode..."
              cp -rv /tmp/opencode-restore/omo/manual-oh-my-opencode/* "$HOME/.oh-my-opencode/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/cache-opencode-node-modules" ]; then
              echo "Restoring cached OmO npm packages under ~/.cache/opencode/node_modules..."
              mkdir -p "$HOME/.cache/opencode/node_modules"
              cp -rv /tmp/opencode-restore/omo/cache-opencode-node-modules/* "$HOME/.cache/opencode/node_modules/" 2>/dev/null || true
            fi
            if [ -d "/tmp/opencode-restore/omo/bin-node-modules" ]; then
              echo "Restoring OmO packages under ~/.local/share/opencode/bin/node_modules..."
              mkdir -p "$HOME/.local/share/opencode/bin/node_modules"
              cp -rv /tmp/opencode-restore/omo/bin-node-modules/* "$HOME/.local/share/opencode/bin/node_modules/" 2>/dev/null || true
            fi
            if [ -f "/tmp/opencode-restore/omo/repo-opencode/oh-my-openagent-configs.tar.gz" ] && [ -d "$HOME/repos" ]; then
              echo "Restoring repo-level .opencode Oh My OpenAgent/OpenCode configs..."
              tar -xzf /tmp/opencode-restore/omo/repo-opencode/oh-my-openagent-configs.tar.gz -C "$HOME/repos" 2>/dev/null || true
            fi

            echo "Session restored successfully!"
          else
            echo "No previous session found. Fresh start."
          fi

      # ============================================================
      # CACHE: Speed up npm installations
      # ============================================================
      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          npm install -g opencode-ai @openchamber/web
          sudo apt update
          sudo apt install -y jq lsof coreutils curl wget

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "cloudflare" ]]; then
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
          else
            curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update
            sudo apt install -y ngrok
            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          fi

      - name: Configure OpenCode (Complete Antigravity Suite)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat << 'EOF' > "$HOME/.config/opencode/opencode.json"
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": ["opencode-antigravity-auth@beta", "oh-my-openagent"],
            "provider": {
              "openai": {
                "options": {
                  "baseURL": "https://anyrouter.top/v1",
                  "apiKey": "sk-Ntp7Be3U7aRQjtNyLUJReKeO6wuInQrnha5VaL8wvmxOf6pb",
                }
              },
              "evolvex": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Modal",
                "options": {
                  "baseURL": "https://api.us-west-2.modal.direct/v1",
                  "apiKey": "{env:EVOLVEX_API_KEY}"
                },
                "models": {
                  "zai-org/GLM-5.1-FP8": {
                    "name": "GLM-5.1"
                  }
                }
              },
              "google": {
                "models": {
                  "antigravity-gemini-3-pro": {
                    "name": "Gemini 3 Pro (Antigravity)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingLevel": "low" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-gemini-3-flash": {
                    "name": "Gemini 3 Flash (Antigravity)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "minimal": { "thinkingLevel": "minimal" },
                      "low": { "thinkingLevel": "low" },
                      "medium": { "thinkingLevel": "medium" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-claude-sonnet-4-5": {
                    "name": "Claude Sonnet 4.5 (no thinking) (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "antigravity-claude-sonnet-4-5-thinking": {
                    "name": "Claude Sonnet 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "antigravity-claude-opus-4-5-thinking": {
                    "name": "Claude Opus 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "gemini-2.5-flash": {
                    "name": "Gemini 2.5 Flash (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-2.5-pro": {
                    "name": "Gemini 2.5 Pro (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-flash-preview": {
                    "name": "Gemini 3 Flash Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-pro-preview": {
                    "name": "Gemini 3 Pro Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  }
                }
              }
            }
          }
          EOF

          # Runtime guard: OpenCode loads npm plugins from config before global plugin files,
          # so this local plugin runs after Oh My OpenAgent has registered its agents.
          # It strips model/temperature pins from the final live agent config, including
          # built-in OmO agents and subagents with hardcoded defaults.
          mkdir -p "$HOME/.config/opencode/plugins"
          cat << 'EOF' > "$HOME/.config/opencode/plugins/zz-omo-strip-model-temperature.js"
          export const OmoStripModelTemperature = async () => {
            const STRIP_KEYS = new Set(["model", "temperature", "fallback_models", "fallbackModels"]);

            function scrub(value) {
              let removed = 0;
              if (!value || typeof value !== "object") return removed;
              if (Array.isArray(value)) {
                for (const item of value) removed += scrub(item);
                return removed;
              }
              for (const key of Object.keys(value)) {
                if (STRIP_KEYS.has(key)) {
                  delete value[key];
                  removed += 1;
                } else {
                  removed += scrub(value[key]);
                }
              }
              return removed;
            }

            return {
              config: async (cfg) => {
                let removed = 0;
                removed += scrub(cfg?.agent);
                removed += scrub(cfg?.agents);
                removed += scrub(cfg?.subagent);
                removed += scrub(cfg?.subagents);
                removed += scrub(cfg?.categories);
                removed += scrub(cfg?.category);
                removed += scrub(cfg?.["oh-my-openagent"]);
                removed += scrub(cfg?.["oh-my-opencode"]);
                removed += scrub(cfg?.ohMyOpenAgent);
                removed += scrub(cfg?.ohMyOpencode);
                if (removed > 0) {
                  console.log(`[omo-strip] removed ${removed} model/temperature/fallback override(s) from runtime agent config`);
                }
              },
            };
          };
          EOF

          # File-level guard: scrub restored/local Oh My OpenAgent/OpenCode config files on
          # this runner. This covers user config, project .opencode config, and legacy names.
          python3 << 'PY'
          import json
          import os
          import re
          from pathlib import Path

          HOME = Path.home()
          STRIP_KEYS = {"model", "temperature", "fallback_models", "fallbackModels"}
          TARGET_BASENAMES = {
              "oh-my-openagent.json", "oh-my-openagent.jsonc",
              "oh-my-opencode.json", "oh-my-opencode.jsonc",
          }
          SKIP_DIRS = {".git", "node_modules", ".next", "dist", "build", "vendor"}

          def strip_jsonc(text: str) -> str:
              out = []
              i = 0
              in_str = False
              quote = ""
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if in_str:
                      out.append(c)
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == quote:
                          in_str = False
                      i += 1
                      continue
                  if c in ('"', "'"):
                      in_str = True
                      quote = c
                      out.append(c)
                      i += 1
                      continue
                  if c == "/" and n == "/":
                      i += 2
                      while i < len(text) and text[i] not in "\r\n":
                          i += 1
                      continue
                  if c == "/" and n == "*":
                      i += 2
                      while i + 1 < len(text) and not (text[i] == "*" and text[i + 1] == "/"):
                          i += 1
                      i += 2
                      continue
                  out.append(c)
                  i += 1
              cleaned = "".join(out)
              cleaned = re.sub(r",\s*([}\]])", r"\1", cleaned)
              return cleaned

          def scrub(value):
              removed = 0
              if isinstance(value, dict):
                  for key in list(value.keys()):
                      if key in STRIP_KEYS:
                          del value[key]
                          removed += 1
                      else:
                          removed += scrub(value[key])
              elif isinstance(value, list):
                  for item in value:
                      removed += scrub(item)
              return removed

          def candidate_files():
              seen = set()
              roots = [
                  HOME / ".config" / "opencode",
                  HOME / ".config" / "oh-my-openagent",
                  HOME / ".config" / "oh-my-opencode",
                  HOME / ".local" / "share" / "oh-my-openagent",
                  HOME / ".local" / "share" / "oh-my-opencode",
                  HOME / ".oh-my-openagent",
                  HOME / ".oh-my-opencode",
              ]
              for root in roots:
                  if not root.exists():
                      continue
                  for path in root.rglob("*"):
                      if path.is_file() and (path.name in TARGET_BASENAMES or path.suffix in {".json", ".jsonc"}):
                          if path not in seen:
                              seen.add(path)
                              yield path
              repos = HOME / "repos"
              if repos.exists():
                  for dirpath, dirnames, filenames in os.walk(repos):
                      dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
                      if Path(dirpath).name != ".opencode":
                          continue
                      for filename in filenames:
                          if filename in TARGET_BASENAMES:
                              path = Path(dirpath) / filename
                              if path not in seen:
                                  seen.add(path)
                                  yield path

          changed_files = 0
          removed_total = 0
          for path in candidate_files():
              try:
                  raw = path.read_text(encoding="utf-8")
                  data = json.loads(strip_jsonc(raw))
              except Exception as exc:
                  print(f"[omo-strip] skipped unparsable config: {path} ({exc})")
                  continue
              removed = scrub(data)
              if removed:
                  path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
                  changed_files += 1
                  removed_total += removed
                  print(f"[omo-strip] scrubbed {removed} override(s): {path}")

          fallback = HOME / ".config" / "opencode" / "oh-my-openagent.json"
          has_user_config = any((HOME / ".config" / "opencode" / name).exists() for name in TARGET_BASENAMES)
          if not has_user_config:
              fallback.write_text(json.dumps({"agents": {}, "categories": {}}, indent=2) + "\n", encoding="utf-8")
              print(f"[omo-strip] wrote minimal local OmO config without remote schema: {fallback}")

          print(f"[omo-strip] file pass complete: {changed_files} file(s), {removed_total} override(s) removed")
          PY

      - name: Initial Startup
        run: |
          nohup stdbuf -oL openchamber --port 3000 > openchamber.log 2>&1 &

          echo "Waiting for OpenChamber to start..."
          for i in $(seq 1 30); do
            if lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "OpenChamber is listening on port 3000"
              break
            fi
            sleep 2
          done

          if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "OpenChamber failed to start"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            exit 1
          fi

          : > tunnel.log

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
            nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &

            echo "Waiting for ngrok URL..."
            for i in $(seq 1 30); do
              URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "ngrok exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          else
            nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &

            echo "Waiting for Cloudflare URL..."
            for i in $(seq 1 45); do
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "cloudflared exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          fi

          if ! grep -q '^URL=' "$GITHUB_ENV"; then
            echo "Tunnel failed to produce a public URL"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            echo "=== tunnel.log ==="
            tail -n 200 tunnel.log || true
            exit 1
          fi

      - name: Monitor & Self-Heal
        run: |
          echo "------------------------------------------"
          echo "SERVER LIVE AT: ${{ env.URL }}"
          echo "AUTO-SHUTDOWN IN: ${{ github.event.inputs.timeout_minutes }} minute(s)"
          echo "All your repos available at: ~/repos/"
          echo "------------------------------------------"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$(( ${{ github.event.inputs.timeout_minutes }} * 60 ))

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( TIMEOUT_SECONDS - ELAPSED ))

            if [ "$REMAINING" -le 0 ]; then
              echo "[$(date)] Timeout reached. Initiating graceful shutdown..."
              pkill -f "openchamber|ngrok|cloudflared" 2>/dev/null || true
              break
            fi

            if [ $(( ELAPSED % 300 )) -lt 5 ]; then
              echo "[$(date)] Time remaining: $(( REMAINING / 60 )) minutes"
            fi

            if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "[$(date)] Restoring OpenChamber..."
              nohup stdbuf -oL openchamber --port 3000 >> openchamber.log 2>&1 &
              sleep 10
            fi

            if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting ngrok tunnel..."
                : > tunnel.log
                nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &
                sleep 10
                URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            else
              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting Cloudflare tunnel..."
                : > tunnel.log
                nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
                sleep 15
                URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            fi

            tail -n 1 openchamber.log 2>/dev/null || true
            sleep 5
          done

      - name: Prepare Session Data for Save
        if: always()
        run: |
          echo "Preparing session data for persistence..."
          mkdir -p /tmp/opencode-save/config \
                   /tmp/opencode-save/openchamber \
                   /tmp/opencode-save/opencode-worktree \
                   /tmp/opencode-save/project \
                   /tmp/opencode-save/worktree \
                   /tmp/opencode-save/state \
                   /tmp/opencode-save/storage \
                   /tmp/opencode-save/cache \
                   /tmp/opencode-save/log \
                   /tmp/opencode-save/bin \
                   /tmp/opencode-save/omo/config-opencode \
                   /tmp/opencode-save/omo/config-oh-my-openagent \
                   /tmp/opencode-save/omo/config-oh-my-opencode \
                   /tmp/opencode-save/omo/local-share-oh-my-openagent \
                   /tmp/opencode-save/omo/local-share-oh-my-opencode \
                   /tmp/opencode-save/omo/cache-oh-my-openagent \
                   /tmp/opencode-save/omo/cache-oh-my-opencode \
                   /tmp/opencode-save/omo/cache-opencode-node-modules \
                   /tmp/opencode-save/omo/bin-node-modules \
                   /tmp/opencode-save/omo/manual-oh-my-openagent \
                   /tmp/opencode-save/omo/manual-oh-my-opencode \
                   /tmp/opencode-save/omo/repo-opencode

          if [ -d "$HOME/.config/opencode" ] && [ "$(ls -A "$HOME/.config/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode/"* /tmp/opencode-save/config/ 2>/dev/null || true
            echo "OpenCode config saved: $(ls -la /tmp/opencode-save/config/ 2>/dev/null | wc -l) files"
          else
            echo "No OpenCode config data to save"
          fi

          if [ -d "$HOME/.config/openchamber" ] && [ "$(ls -A "$HOME/.config/openchamber" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/openchamber/"* /tmp/opencode-save/openchamber/ 2>/dev/null || true
            echo "OpenChamber config saved: $(find "$HOME/.config/openchamber" -type f 2>/dev/null | wc -l) files"
          else
            echo "No OpenChamber config data to save"
          fi

          if [ -d "$HOME/.config/opencode-worktree" ] && [ "$(ls -A "$HOME/.config/opencode-worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode-worktree/"* /tmp/opencode-save/opencode-worktree/ 2>/dev/null || true
            echo "Worktree config saved: $(find "$HOME/.config/opencode-worktree" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -f "$HOME/.local/share/opencode/auth.json" ]; then
            cp -v "$HOME/.local/share/opencode/auth.json" /tmp/opencode-save/auth.json 2>/dev/null || true
            echo "Auth data saved"
          fi

          if [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            cp -v "$HOME/.local/share/opencode/opencode.db"* /tmp/opencode-save/ 2>/dev/null || true
            echo "SQLite database saved: $(ls -la /tmp/opencode-save/opencode.db* 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/state/opencode" ] && [ "$(ls -A "$HOME/.local/state/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/state/opencode/"* /tmp/opencode-save/state/ 2>/dev/null || true
            echo "State data saved: $(find "$HOME/.local/state/opencode" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/project" ] && [ "$(ls -A "$HOME/.local/share/opencode/project" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/project/"* /tmp/opencode-save/project/ 2>/dev/null || true
            echo "Project sessions saved: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
          else
            echo "No project session data to save"
          fi

          if [ -d "$HOME/.local/share/opencode/worktree" ] && [ "$(ls -A "$HOME/.local/share/opencode/worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/worktree/"* /tmp/opencode-save/worktree/ 2>/dev/null || true
            echo "Worktrees saved: $(find "$HOME/.local/share/opencode/worktree" -type f 2>/dev/null | wc -l) files"
          else
            echo "No worktree data to save"
          fi

          if [ -d "$HOME/.local/share/opencode/storage" ] && [ "$(ls -A "$HOME/.local/share/opencode/storage" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/storage/"* /tmp/opencode-save/storage/ 2>/dev/null || true
            echo "Legacy storage saved: $(find "$HOME/.local/share/opencode/storage" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.cache/opencode" ] && [ "$(ls -A "$HOME/.cache/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/opencode/"* /tmp/opencode-save/cache/ 2>/dev/null || true
            echo "Cache saved: $(find "$HOME/.cache/opencode" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/log" ] && [ "$(ls -A "$HOME/.local/share/opencode/log" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/log/"* /tmp/opencode-save/log/ 2>/dev/null || true
            echo "Logs saved: $(find "$HOME/.local/share/opencode/log" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/bin" ] && [ "$(ls -A "$HOME/.local/share/opencode/bin" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/bin/"* /tmp/opencode-save/bin/ 2>/dev/null || true
            echo "Bin directory saved: $(find "$HOME/.local/share/opencode/bin" -type f 2>/dev/null | wc -l) files"
          fi

          echo "Saving Oh My OpenAgent / legacy Oh My OpenCode files explicitly..."
          cp -v "$HOME/.config/opencode/oh-my-openagent."* /tmp/opencode-save/omo/config-opencode/ 2>/dev/null || true
          cp -v "$HOME/.config/opencode/oh-my-opencode."* /tmp/opencode-save/omo/config-opencode/ 2>/dev/null || true
          if [ -d "$HOME/.config/opencode/plugins" ]; then
            find "$HOME/.config/opencode/plugins" -maxdepth 1 -type f \( -iname '*omo*' -o -iname '*openagent*' -o -iname '*opencode*' \) -exec cp -v {} /tmp/opencode-save/omo/config-opencode/ \; 2>/dev/null || true
          fi
          if [ -d "$HOME/.config/oh-my-openagent" ] && [ "$(ls -A "$HOME/.config/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/oh-my-openagent/"* /tmp/opencode-save/omo/config-oh-my-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.config/oh-my-opencode" ] && [ "$(ls -A "$HOME/.config/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/oh-my-opencode/"* /tmp/opencode-save/omo/config-oh-my-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/oh-my-openagent" ] && [ "$(ls -A "$HOME/.local/share/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/oh-my-openagent/"* /tmp/opencode-save/omo/local-share-oh-my-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/oh-my-opencode" ] && [ "$(ls -A "$HOME/.local/share/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/oh-my-opencode/"* /tmp/opencode-save/omo/local-share-oh-my-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/oh-my-openagent" ] && [ "$(ls -A "$HOME/.cache/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/oh-my-openagent/"* /tmp/opencode-save/omo/cache-oh-my-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/oh-my-opencode" ] && [ "$(ls -A "$HOME/.cache/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/oh-my-opencode/"* /tmp/opencode-save/omo/cache-oh-my-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/opencode/node_modules/oh-my-openagent" ]; then
            cp -rv "$HOME/.cache/opencode/node_modules/oh-my-openagent" /tmp/opencode-save/omo/cache-opencode-node-modules/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/opencode/node_modules/oh-my-opencode" ]; then
            cp -rv "$HOME/.cache/opencode/node_modules/oh-my-opencode" /tmp/opencode-save/omo/cache-opencode-node-modules/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/opencode/bin/node_modules/oh-my-openagent" ]; then
            cp -rv "$HOME/.local/share/opencode/bin/node_modules/oh-my-openagent" /tmp/opencode-save/omo/bin-node-modules/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/opencode/bin/node_modules/oh-my-opencode" ]; then
            cp -rv "$HOME/.local/share/opencode/bin/node_modules/oh-my-opencode" /tmp/opencode-save/omo/bin-node-modules/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.oh-my-openagent" ] && [ "$(ls -A "$HOME/.oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.oh-my-openagent/"* /tmp/opencode-save/omo/manual-oh-my-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.oh-my-opencode" ] && [ "$(ls -A "$HOME/.oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.oh-my-opencode/"* /tmp/opencode-save/omo/manual-oh-my-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/repos" ]; then
            (
              cd "$HOME/repos" &&
              find . -type f \(                 -path '*/.opencode/oh-my-openagent.json' -o                 -path '*/.opencode/oh-my-openagent.jsonc' -o                 -path '*/.opencode/oh-my-opencode.json' -o                 -path '*/.opencode/oh-my-opencode.jsonc'               \) -print0 | tar --null -czf /tmp/opencode-save/omo/repo-opencode/oh-my-openagent-configs.tar.gz --files-from - 2>/dev/null || true
            )
          fi
          echo "OmO saved files: $(find /tmp/opencode-save/omo -type f 2>/dev/null | wc -l)"

          if [ "$(find /tmp/opencode-save -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Session data prepared successfully: $(find /tmp/opencode-save -type f | wc -l) files total"
            ls -la /tmp/opencode-save/
          else
            echo "No session data to save - creating placeholder"
            echo "$(date): No session data available" > /tmp/opencode-save/placeholder.txt
          fi

      - name: Upload Session Data (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session
          path: /tmp/opencode-save/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
