name: OpenChamber

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: "Select Tunnel Provider"
        required: true
        default: "ngrok"
        type: choice
        options:
          - ngrok
          - cloudflare
      timeout_minutes:
        description: "Auto-shutdown after (minutes)"
        required: true
        default: "300"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    env:
      EVOLVEX_API_KEY: ${{ secrets.EVOLVEX_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Git with Your Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Clone All Your Repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/repos"
          cd "$HOME/repos"

          repos=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&affiliation=owner" \
            | jq -r '.[].clone_url')

          for repo in $repos; do
            echo "Cloning $repo..."
            git clone "https://$GH_TOKEN@${repo#https://}" || true
          done

      # ============================================================
      # PERSISTENCE: Restore previous session (OAuth tokens, accounts)
      # ============================================================
      - name: Restore Session Data (Artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: opencode-session
          path: /tmp/opencode-restore
          workflow: opencode.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Restored Session Data
        run: |
          echo "=== RESTORE DEBUG ==="
          echo "Contents of /tmp/opencode-restore:"
          ls -la /tmp/opencode-restore/ 2>/dev/null || echo "Directory does not exist"

          if [ -d "/tmp/opencode-restore" ]; then
            echo "Found restore directory, checking contents..."
            find /tmp/opencode-restore -type f 2>/dev/null || echo "No files found"

            mkdir -p "$HOME/.config/opencode" \
                     "$HOME/.local/share/opencode/project" \
                     "$HOME/.local/state/opencode" \
                     "$HOME/.config/openchamber" \
                     "$HOME/.config/opencode-worktree" \
                     "$HOME/.config/oh-my-openagent" \
                     "$HOME/.config/oh-my-opencode" \
                     "$HOME/.local/share/oh-my-openagent" \
                     "$HOME/.local/share/oh-my-opencode" \
                     "$HOME/.local/share/opencode/worktree" \
                     "$HOME/.local/share/opencode/bin" \
                     "$HOME/.local/share/opencode/log" \
                     "$HOME/.cache/opencode" \
                     "$HOME/.cache/oh-my-openagent" \
                     "$HOME/.cache/oh-my-opencode" \
                     "$HOME/.oh-my-openagent" \
                     "$HOME/.oh-my-opencode"

            if [ -d "/tmp/opencode-restore/config" ]; then
              echo "Restoring OpenCode config files..."
              cp -rv /tmp/opencode-restore/config/* "$HOME/.config/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/openchamber" ]; then
              echo "Restoring OpenChamber config files..."
              cp -rv /tmp/opencode-restore/openchamber/* "$HOME/.config/openchamber/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/opencode-worktree" ]; then
              echo "Restoring Worktree config files..."
              cp -rv /tmp/opencode-restore/opencode-worktree/* "$HOME/.config/opencode-worktree/" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/auth.json" ]; then
              echo "Restoring auth.json..."
              cp -v /tmp/opencode-restore/auth.json "$HOME/.local/share/opencode/auth.json" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/opencode.db" ]; then
              echo "Restoring SQLite database..."
              cp -v /tmp/opencode-restore/opencode.db* "$HOME/.local/share/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/state" ]; then
              echo "Restoring state directory..."
              cp -rv /tmp/opencode-restore/state/* "$HOME/.local/state/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/project" ]; then
              echo "Restoring project sessions..."
              cp -rv /tmp/opencode-restore/project/* "$HOME/.local/share/opencode/project/" 2>/dev/null || true
              echo "Sessions restored: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/worktree" ]; then
              echo "Restoring git worktrees..."
              cp -rv /tmp/opencode-restore/worktree/* "$HOME/.local/share/opencode/worktree/" 2>/dev/null || true
              echo "Worktrees restored: $(find "$HOME/.local/share/opencode/worktree" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/cache" ]; then
              echo "Restoring cache..."
              cp -rv /tmp/opencode-restore/cache/* "$HOME/.cache/opencode/" 2>/dev/null || true
              echo "Cache restored: $(find "$HOME/.cache/opencode" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/log" ]; then
              echo "Restoring logs..."
              cp -rv /tmp/opencode-restore/log/* "$HOME/.local/share/opencode/log/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/bin" ]; then
              echo "Restoring bin directory..."
              cp -rv /tmp/opencode-restore/bin/* "$HOME/.local/share/opencode/bin/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/storage" ]; then
              echo "Restoring legacy storage..."
              mkdir -p "$HOME/.local/share/opencode/storage"
              cp -rv /tmp/opencode-restore/storage/* "$HOME/.local/share/opencode/storage/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-config-openagent" ]; then
              echo "Restoring Oh My OpenAgent config..."
              cp -rv /tmp/opencode-restore/omo-config-openagent/* "$HOME/.config/oh-my-openagent/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-config-opencode" ]; then
              echo "Restoring Oh My OpenCode config..."
              cp -rv /tmp/opencode-restore/omo-config-opencode/* "$HOME/.config/oh-my-opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-share-openagent" ]; then
              echo "Restoring Oh My OpenAgent share data..."
              cp -rv /tmp/opencode-restore/omo-share-openagent/* "$HOME/.local/share/oh-my-openagent/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-share-opencode" ]; then
              echo "Restoring Oh My OpenCode share data..."
              cp -rv /tmp/opencode-restore/omo-share-opencode/* "$HOME/.local/share/oh-my-opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-cache-openagent" ]; then
              echo "Restoring Oh My OpenAgent cache..."
              cp -rv /tmp/opencode-restore/omo-cache-openagent/* "$HOME/.cache/oh-my-openagent/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-cache-opencode" ]; then
              echo "Restoring Oh My OpenCode cache..."
              cp -rv /tmp/opencode-restore/omo-cache-opencode/* "$HOME/.cache/oh-my-opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-home-openagent" ]; then
              echo "Restoring ~/.oh-my-openagent..."
              cp -rv /tmp/opencode-restore/omo-home-openagent/* "$HOME/.oh-my-openagent/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/omo-home-opencode" ]; then
              echo "Restoring ~/.oh-my-opencode..."
              cp -rv /tmp/opencode-restore/omo-home-opencode/* "$HOME/.oh-my-opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/repo-omo-configs" ] && [ -d "$HOME/repos" ]; then
              echo "Restoring repo-level OmO config files..."
              (cd /tmp/opencode-restore/repo-omo-configs && tar cf - .) | (cd "$HOME/repos" && tar xvf -) 2>/dev/null || true
            fi

            echo "Session restored successfully!"
          else
            echo "No previous session found. Fresh start."
          fi

      # ============================================================
      # CACHE: Speed up npm installations
      # ============================================================
      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          npm install -g opencode-ai @openchamber/web
          sudo apt update
          sudo apt install -y jq lsof coreutils curl wget

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "cloudflare" ]]; then
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
          else
            curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update
            sudo apt install -y ngrok
            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          fi

      - name: Configure OpenCode (Complete Antigravity Suite)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat << 'EOF' > "$HOME/.config/opencode/opencode.json"
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": ["opencode-antigravity-auth@beta", "oh-my-openagent"],
            "provider": {
              "openai": {
                "options": {
                  "baseURL": "https://anyrouter.top/v1",
                  "apiKey": "sk-Ntp7Be3U7aRQjtNyLUJReKeO6wuInQrnha5VaL8wvmxOf6pb",
                }
              },
              "evolvex": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Modal",
                "options": {
                  "baseURL": "https://api.us-west-2.modal.direct/v1",
                  "apiKey": "{env:EVOLVEX_API_KEY}"
                },
                "models": {
                  "zai-org/GLM-5.1-FP8": {
                    "name": "GLM-5.1"
                  }
                }
              },
              "google": {
                "models": {
                  "antigravity-gemini-3-pro": {
                    "name": "Gemini 3 Pro (Antigravity)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingLevel": "low" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-gemini-3-flash": {
                    "name": "Gemini 3 Flash (Antigravity)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "minimal": { "thinkingLevel": "minimal" },
                      "low": { "thinkingLevel": "low" },
                      "medium": { "thinkingLevel": "medium" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-claude-sonnet-4-5": {
                    "name": "Claude Sonnet 4.5 (no thinking) (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "antigravity-claude-sonnet-4-5-thinking": {
                    "name": "Claude Sonnet 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "antigravity-claude-opus-4-5-thinking": {
                    "name": "Claude Opus 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "gemini-2.5-flash": {
                    "name": "Gemini 2.5 Flash (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-2.5-pro": {
                    "name": "Gemini 2.5 Pro (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-flash-preview": {
                    "name": "Gemini 3 Flash Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-pro-preview": {
                    "name": "Gemini 3 Pro Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  }
                }
              }
            }
          }
          EOF


      - name: Prepare OmO/OpenCode Agent Override Removal
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode"

          # OmO config: no per-agent model/temperature entries, no category model defaults.
          # Important: empty/omitted is used, not null.
          cat << 'EOF' > "$HOME/.config/opencode/oh-my-opencode.jsonc"
          {
            "agents": {
              "sisyphus": {},
              "hephaestus": {},
              "prometheus": {},
              "oracle": {},
              "librarian": {},
              "explore": {},
              "multimodal-looker": {},
              "metis": {},
              "momus": {},
              "atlas": {},
              "sisyphus-junior": {}
            },
            "categories": {},
            "model_fallback": false,
            "runtime_fallback": false,
            "disabled_hooks": ["model-fallback", "runtime-fallback"]
          }
          EOF
          cp "$HOME/.config/opencode/oh-my-opencode.jsonc" "$HOME/.config/opencode/oh-my-openagent.jsonc"

          cat > /tmp/strip-omo-agent-overrides.py << 'PY'
          import os, re, sys
          from pathlib import Path

          HOME = Path.home()
          KEYS = r'(?:model|temperature|top_p|topP|fallback_models|fallbackModels|variant)'
          BAD_MODELS = re.compile(r'(openai/gpt-5\.4-mini-fast|openai/gpt-5\.4-mini|anthropic/claude-opus-4\.7|gpt-5\.4-mini-fast|claude-opus-4\.7)', re.I)

          def is_probably_text(p: Path) -> bool:
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.db','.sqlite','.sqlite3','.lock','.tgz','.gz','.zip'}:
                  return False
              try:
                  b = p.read_bytes()[:4096]
              except Exception:
                  return False
              return b'\0' not in b

          def patch_text(s: str) -> str:
              before = s
              # Remove YAML/frontmatter/list-style scalar overrides.
              s = re.sub(r'(?m)^([ \t-]*)(model|temperature|top_p|topP|fallback_models|fallbackModels|variant):[ \t]*(?:.*)$\n?', '', s)
              # Remove quoted JSON/JSONC object properties, including simple arrays/objects.
              for _ in range(8):
                  ns = re.sub(r'(?s)([{,]\s*)(["\'])(?:model|temperature|top_p|topP|fallback_models|fallbackModels|variant)\2\s*:\s*(?:"(?:\\.|[^"])*"|\'(?:\\.|[^\'])*\'|[-+]?[0-9]*\.?[0-9]+|true|false|null|\[[^\[\]]*\]|\{[^{}]*\})\s*,?', r'\1', s)
                  ns = re.sub(r'(?s)([{,]\s*)(?:model|temperature|top_p|topP|fallback_models|fallbackModels|variant)\s*:\s*(?:"(?:\\.|[^"])*"|\'(?:\\.|[^\'])*\'|[-+]?[0-9]*\.?[0-9]+|true|false|null|\[[^\[\]]*\]|\{[^{}]*\})\s*,?', r'\1', ns)
                  if ns == s:
                      break
                  s = ns
              # Clean up obvious strict-JSON comma damage.
              s = re.sub(r',\s*([}\]])', r'\1', s)
              s = re.sub(r'([\[{])\s*,', r'\1', s)
              return s

          roots = [
              HOME/'.config/opencode',
              HOME/'.config/openchamber',
              HOME/'.config/oh-my-openagent',
              HOME/'.config/oh-my-opencode',
              HOME/'.local/share/opencode',
              HOME/'.local/share/oh-my-openagent',
              HOME/'.local/share/oh-my-opencode',
              HOME/'.cache/opencode',
              HOME/'.cache/oh-my-openagent',
              HOME/'.cache/oh-my-opencode',
              HOME/'.oh-my-openagent',
              HOME/'.oh-my-opencode',
              HOME/'repos',
          ]

          interesting_path = re.compile(r'(oh-my-openagent|oh-my-opencode|opencode[/\\](agents|commands)|\.opencode[/\\](agents|commands|oh-my)|openchamber)', re.I)
          changed = 0
          scanned = 0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  ps = str(p)
                  if not interesting_path.search(ps):
                      continue
                  if not is_probably_text(p):
                      continue
                  try:
                      raw = p.read_text(errors='ignore')
                  except Exception:
                      continue
                  scanned += 1
                  new = patch_text(raw)
                  if new != raw:
                      try:
                          p.write_text(new)
                          print(f'patched {p}')
                          changed += 1
                      except Exception as e:
                          print(f'could not patch {p}: {e}', file=sys.stderr)
          print(f'override-strip scanned={scanned} changed={changed}')
          PY

          python3 /tmp/strip-omo-agent-overrides.py

      - name: Initial Startup
        run: |
          set -euo pipefail

          echo "Warm-starting OpenChamber once so OpenCode can auto-install configured npm plugins..."
          : > openchamber.log
          nohup stdbuf -oL openchamber --port 3000 > openchamber.log 2>&1 &
          WARM_PID=$!
          for i in $(seq 1 45); do
            if lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "Warm OpenChamber start complete"
              break
            fi
            sleep 2
          done
          sleep 8
          pkill -f "openchamber --port 3000" 2>/dev/null || true
          wait "$WARM_PID" 2>/dev/null || true

          echo "Patching local cached/generated OmO agent defaults after plugin install..."
          python3 /tmp/strip-omo-agent-overrides.py || true
          echo "Known remaining default model strings after patch:"
          grep -RInE 'gpt-5\.4-mini-fast|claude-opus-4\.7'             "$HOME/.config/opencode" "$HOME/.config/openchamber" "$HOME/.local/share/opencode" "$HOME/.cache/opencode"             2>/dev/null | head -n 50 || true

          echo "Starting final OpenChamber..."
          : > openchamber.log
          nohup stdbuf -oL openchamber --port 3000 > openchamber.log 2>&1 &

          echo "Waiting for OpenChamber to start..."
          for i in $(seq 1 30); do
            if lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "OpenChamber is listening on port 3000"
              break
            fi
            sleep 2
          done

          if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "OpenChamber failed to start"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            exit 1
          fi

          : > tunnel.log

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
            nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &

            echo "Waiting for ngrok URL..."
            for i in $(seq 1 30); do
              URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "ngrok exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          else
            nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &

            echo "Waiting for Cloudflare URL..."
            for i in $(seq 1 45); do
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "cloudflared exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          fi

          if ! grep -q '^URL=' "$GITHUB_ENV"; then
            echo "Tunnel failed to produce a public URL"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            echo "=== tunnel.log ==="
            tail -n 200 tunnel.log || true
            exit 1
          fi

      - name: Monitor & Self-Heal
        run: |
          echo "------------------------------------------"
          echo "SERVER LIVE AT: ${{ env.URL }}"
          echo "AUTO-SHUTDOWN IN: ${{ github.event.inputs.timeout_minutes }} minute(s)"
          echo "All your repos available at: ~/repos/"
          echo "------------------------------------------"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$(( ${{ github.event.inputs.timeout_minutes }} * 60 ))

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( TIMEOUT_SECONDS - ELAPSED ))

            if [ "$REMAINING" -le 0 ]; then
              echo "[$(date)] Timeout reached. Initiating graceful shutdown..."
              pkill -f "openchamber|ngrok|cloudflared" 2>/dev/null || true
              break
            fi

            if [ $(( ELAPSED % 300 )) -lt 5 ]; then
              echo "[$(date)] Time remaining: $(( REMAINING / 60 )) minutes"
            fi

            if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "[$(date)] Restoring OpenChamber..."
              nohup stdbuf -oL openchamber --port 3000 >> openchamber.log 2>&1 &
              sleep 10
            fi

            if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting ngrok tunnel..."
                : > tunnel.log
                nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &
                sleep 10
                URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            else
              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting Cloudflare tunnel..."
                : > tunnel.log
                nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
                sleep 15
                URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            fi

            tail -n 1 openchamber.log 2>/dev/null || true
            sleep 5
          done

      - name: Prepare Session Data for Save
        if: always()
        run: |
          echo "Preparing session data for persistence..."
          mkdir -p /tmp/opencode-save/config \
                   /tmp/opencode-save/openchamber \
                   /tmp/opencode-save/opencode-worktree \
                   /tmp/opencode-save/project \
                   /tmp/opencode-save/worktree \
                   /tmp/opencode-save/state \
                   /tmp/opencode-save/storage \
                   /tmp/opencode-save/cache \
                   /tmp/opencode-save/log \
                   /tmp/opencode-save/bin \
                   /tmp/opencode-save/omo-config-openagent \
                   /tmp/opencode-save/omo-config-opencode \
                   /tmp/opencode-save/omo-share-openagent \
                   /tmp/opencode-save/omo-share-opencode \
                   /tmp/opencode-save/omo-cache-openagent \
                   /tmp/opencode-save/omo-cache-opencode \
                   /tmp/opencode-save/omo-home-openagent \
                   /tmp/opencode-save/omo-home-opencode \
                   /tmp/opencode-save/repo-omo-configs

          if [ -d "$HOME/.config/opencode" ] && [ "$(ls -A "$HOME/.config/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode/"* /tmp/opencode-save/config/ 2>/dev/null || true
            echo "OpenCode config saved: $(ls -la /tmp/opencode-save/config/ 2>/dev/null | wc -l) files"
          else
            echo "No OpenCode config data to save"
          fi

          if [ -d "$HOME/.config/openchamber" ] && [ "$(ls -A "$HOME/.config/openchamber" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/openchamber/"* /tmp/opencode-save/openchamber/ 2>/dev/null || true
            echo "OpenChamber config saved: $(find "$HOME/.config/openchamber" -type f 2>/dev/null | wc -l) files"
          else
            echo "No OpenChamber config data to save"
          fi

          if [ -d "$HOME/.config/opencode-worktree" ] && [ "$(ls -A "$HOME/.config/opencode-worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode-worktree/"* /tmp/opencode-save/opencode-worktree/ 2>/dev/null || true
            echo "Worktree config saved: $(find "$HOME/.config/opencode-worktree" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -f "$HOME/.local/share/opencode/auth.json" ]; then
            cp -v "$HOME/.local/share/opencode/auth.json" /tmp/opencode-save/auth.json 2>/dev/null || true
            echo "Auth data saved"
          fi

          if [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            cp -v "$HOME/.local/share/opencode/opencode.db"* /tmp/opencode-save/ 2>/dev/null || true
            echo "SQLite database saved: $(ls -la /tmp/opencode-save/opencode.db* 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/state/opencode" ] && [ "$(ls -A "$HOME/.local/state/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/state/opencode/"* /tmp/opencode-save/state/ 2>/dev/null || true
            echo "State data saved: $(find "$HOME/.local/state/opencode" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/project" ] && [ "$(ls -A "$HOME/.local/share/opencode/project" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/project/"* /tmp/opencode-save/project/ 2>/dev/null || true
            echo "Project sessions saved: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
          else
            echo "No project session data to save"
          fi

          if [ -d "$HOME/.local/share/opencode/worktree" ] && [ "$(ls -A "$HOME/.local/share/opencode/worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/worktree/"* /tmp/opencode-save/worktree/ 2>/dev/null || true
            echo "Worktrees saved: $(find "$HOME/.local/share/opencode/worktree" -type f 2>/dev/null | wc -l) files"
          else
            echo "No worktree data to save"
          fi

          if [ -d "$HOME/.local/share/opencode/storage" ] && [ "$(ls -A "$HOME/.local/share/opencode/storage" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/storage/"* /tmp/opencode-save/storage/ 2>/dev/null || true
            echo "Legacy storage saved: $(find "$HOME/.local/share/opencode/storage" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.cache/opencode" ] && [ "$(ls -A "$HOME/.cache/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/opencode/"* /tmp/opencode-save/cache/ 2>/dev/null || true
            echo "Cache saved: $(find "$HOME/.cache/opencode" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/log" ] && [ "$(ls -A "$HOME/.local/share/opencode/log" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/log/"* /tmp/opencode-save/log/ 2>/dev/null || true
            echo "Logs saved: $(find "$HOME/.local/share/opencode/log" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/bin" ] && [ "$(ls -A "$HOME/.local/share/opencode/bin" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/bin/"* /tmp/opencode-save/bin/ 2>/dev/null || true
            echo "Bin directory saved: $(find "$HOME/.local/share/opencode/bin" -type f 2>/dev/null | wc -l) files"
          fi

          # Save OmO/OpenAgent-specific files separately too. OpenCode config above already saves
          # ~/.config/opencode/oh-my-*.jsonc, but these folders can contain OmO state/cache.
          if [ -d "$HOME/.config/oh-my-openagent" ] && [ "$(ls -A "$HOME/.config/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/oh-my-openagent/"* /tmp/opencode-save/omo-config-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.config/oh-my-opencode" ] && [ "$(ls -A "$HOME/.config/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/oh-my-opencode/"* /tmp/opencode-save/omo-config-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/oh-my-openagent" ] && [ "$(ls -A "$HOME/.local/share/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/oh-my-openagent/"* /tmp/opencode-save/omo-share-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.local/share/oh-my-opencode" ] && [ "$(ls -A "$HOME/.local/share/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/oh-my-opencode/"* /tmp/opencode-save/omo-share-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/oh-my-openagent" ] && [ "$(ls -A "$HOME/.cache/oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/oh-my-openagent/"* /tmp/opencode-save/omo-cache-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.cache/oh-my-opencode" ] && [ "$(ls -A "$HOME/.cache/oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/oh-my-opencode/"* /tmp/opencode-save/omo-cache-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.oh-my-openagent" ] && [ "$(ls -A "$HOME/.oh-my-openagent" 2>/dev/null)" ]; then
            cp -rv "$HOME/.oh-my-openagent/"* /tmp/opencode-save/omo-home-openagent/ 2>/dev/null || true
          fi
          if [ -d "$HOME/.oh-my-opencode" ] && [ "$(ls -A "$HOME/.oh-my-opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.oh-my-opencode/"* /tmp/opencode-save/omo-home-opencode/ 2>/dev/null || true
          fi
          if [ -d "$HOME/repos" ]; then
            while IFS= read -r -d '' f; do
              rel="${f#$HOME/repos/}"
              mkdir -p "/tmp/opencode-save/repo-omo-configs/$(dirname "$rel")"
              cp -v "$f" "/tmp/opencode-save/repo-omo-configs/$rel" 2>/dev/null || true
            done < <(find "$HOME/repos" \( -path '*/.opencode/oh-my-openagent.json*' -o -path '*/.opencode/oh-my-opencode.json*' \) -print0 2>/dev/null)
          fi

          if [ "$(find /tmp/opencode-save -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Session data prepared successfully: $(find /tmp/opencode-save -type f | wc -l) files total"
            ls -la /tmp/opencode-save/
          else
            echo "No session data to save - creating placeholder"
            echo "$(date): No session data available" > /tmp/opencode-save/placeholder.txt
          fi

      - name: Upload Session Data (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session
          path: /tmp/opencode-save/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
