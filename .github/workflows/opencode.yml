name: OpenChamber

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: "Select Tunnel Provider"
        required: true
        default: "ngrok"
        type: choice
        options:
          - ngrok
          - cloudflare
      timeout_minutes:
        description: "Auto-shutdown after (minutes)"
        required: true
        default: "300"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Git with Your Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Clone All Your Repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/repos"
          cd "$HOME/repos"

          repos=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&affiliation=owner" \
            | jq -r '.[].clone_url')

          for repo in $repos; do
            echo "Cloning $repo..."
            git clone "https://$GH_TOKEN@${repo#https://}" || true
          done

      - name: Restore Session Data (Artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: opencode-session
          path: /tmp/opencode-restore
          workflow: opencode.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Restored Session Data
        run: |
          echo "=== RESTORE DEBUG ==="
          echo "Contents of /tmp/opencode-restore:"
          ls -la /tmp/opencode-restore/ 2>/dev/null || echo "Directory does not exist"

          if [ -d "/tmp/opencode-restore" ]; then
            echo "Found restore directory, checking contents..."
            find /tmp/opencode-restore -type f 2>/dev/null || echo "No files found"

            mkdir -p "$HOME/.config/opencode" \
                     "$HOME/.local/share/opencode/project" \
                     "$HOME/.local/state/opencode" \
                     "$HOME/.config/openchamber" \
                     "$HOME/.config/opencode-worktree" \
                     "$HOME/.local/share/opencode/worktree" \
                     "$HOME/.local/share/opencode/bin" \
                     "$HOME/.local/share/opencode/log" \
                     "$HOME/.cache/opencode"

            if [ -d "/tmp/opencode-restore/config" ]; then
              echo "Restoring OpenCode config files..."
              cp -rv /tmp/opencode-restore/config/* "$HOME/.config/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/openchamber" ]; then
              echo "Restoring OpenChamber config files..."
              cp -rv /tmp/opencode-restore/openchamber/* "$HOME/.config/openchamber/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/opencode-worktree" ]; then
              echo "Restoring Worktree config files..."
              cp -rv /tmp/opencode-restore/opencode-worktree/* "$HOME/.config/opencode-worktree/" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/auth.json" ]; then
              echo "Restoring auth.json..."
              cp -v /tmp/opencode-restore/auth.json "$HOME/.local/share/opencode/auth.json" 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/opencode.db" ]; then
              echo "Restoring SQLite database..."
              cp -v /tmp/opencode-restore/opencode.db* "$HOME/.local/share/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/state" ]; then
              echo "Restoring state directory..."
              cp -rv /tmp/opencode-restore/state/* "$HOME/.local/state/opencode/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/project" ]; then
              echo "Restoring project sessions..."
              cp -rv /tmp/opencode-restore/project/* "$HOME/.local/share/opencode/project/" 2>/dev/null || true
              echo "Sessions restored: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/worktree" ]; then
              echo "Restoring git worktrees..."
              cp -rv /tmp/opencode-restore/worktree/* "$HOME/.local/share/opencode/worktree/" 2>/dev/null || true
              echo "Worktrees restored: $(find "$HOME/.local/share/opencode/worktree" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/cache" ]; then
              echo "Restoring cache..."
              cp -rv /tmp/opencode-restore/cache/* "$HOME/.cache/opencode/" 2>/dev/null || true
              echo "Cache restored: $(find "$HOME/.cache/opencode" -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/log" ]; then
              echo "Restoring logs..."
              cp -rv /tmp/opencode-restore/log/* "$HOME/.local/share/opencode/log/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/bin" ]; then
              echo "Restoring bin directory..."
              cp -rv /tmp/opencode-restore/bin/* "$HOME/.local/share/opencode/bin/" 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/storage" ]; then
              echo "Restoring legacy storage..."
              mkdir -p "$HOME/.local/share/opencode/storage"
              cp -rv /tmp/opencode-restore/storage/* "$HOME/.local/share/opencode/storage/" 2>/dev/null || true
            fi

            echo "Session restored successfully!"
          else
            echo "No previous session found. Fresh start."
          fi

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          # Pin OpenChamber to 1.8.5 to avoid the 1.8.6 CLI regression
          npm install -g opencode-ai @openchamber/web@1.8.5
          sudo apt update
          sudo apt install -y jq lsof coreutils curl wget

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "cloudflare" ]]; then
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
          else
            curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update
            sudo apt install -y ngrok
            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          fi

      - name: Resolve OpenChamber CLI
        run: |
          OPENCHAMBER_CLI="$(readlink -f "$(command -v openchamber)")"
          echo "OPENCHAMBER_CLI=$OPENCHAMBER_CLI" >> "$GITHUB_ENV"
          echo "Resolved CLI: $OPENCHAMBER_CLI"
          node "$OPENCHAMBER_CLI" --version || true

      - name: Create local ZAPI thought injector
        run: |
          cat << 'EOF' > "$HOME/zapi-thought-proxy.js"
          const http = require("http");
          const https = require("https");

          const PORT = 4010;
          const TARGET_HOST = "zapi.aicc0.com";
          const TARGET_BASE = "/v1";
          const API_KEY = process.env.ZAPI_API_KEY;

          function sendJson(res, status, obj) {
            const body = JSON.stringify(obj);
            res.writeHead(status, {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(body)
            });
            res.end(body);
          }

          function readBody(req) {
            return new Promise((resolve, reject) => {
              let data = "";
              req.on("data", chunk => {
                data += chunk;
              });
              req.on("end", () => resolve(data));
              req.on("error", reject);
            });
          }

          function copyHeaders(upstreamRes) {
            const headers = {};
            headers["Content-Type"] = upstreamRes.headers["content-type"] || "application/json";
            return headers;
          }

          function forwardModels(res) {
            const upstream = https.request({
              hostname: TARGET_HOST,
              port: 443,
              path: `${TARGET_BASE}/models`,
              method: "GET",
              headers: {
                "Authorization": `Bearer ${API_KEY}`
              }
            }, upstreamRes => {
              res.writeHead(upstreamRes.statusCode || 200, copyHeaders(upstreamRes));
              upstreamRes.pipe(res);
            });

            upstream.on("error", err => {
              sendJson(res, 500, { error: { message: String(err) } });
            });

            upstream.end();
          }

          async function forwardChat(req, res) {
            let raw;
            try {
              raw = await readBody(req);
            } catch (err) {
              return sendJson(res, 400, { error: { message: `read error: ${String(err)}` } });
            }

            let payload = {};
            try {
              payload = raw ? JSON.parse(raw) : {};
            } catch (err) {
              return sendJson(res, 400, { error: { message: `invalid json: ${String(err)}` } });
            }

            payload.google = payload.google || {};
            payload.google.thinking_config = payload.google.thinking_config || {};
            payload.google.thinking_config.include_thoughts = true;

            const body = JSON.stringify(payload);

            const upstream = https.request({
              hostname: TARGET_HOST,
              port: 443,
              path: `${TARGET_BASE}/chat/completions`,
              method: "POST",
              headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(body)
              }
            }, upstreamRes => {
              res.writeHead(upstreamRes.statusCode || 200, copyHeaders(upstreamRes));
              upstreamRes.pipe(res);
            });

            upstream.on("error", err => {
              sendJson(res, 500, { error: { message: String(err) } });
            });

            upstream.write(body);
            upstream.end();
          }

          const server = http.createServer(async (req, res) => {
            try {
              if (req.method === "GET" && req.url === "/healthz") {
                return sendJson(res, 200, { ok: true });
              }

              if (req.method === "GET" && req.url === "/v1/models") {
                return forwardModels(res);
              }

              if (req.method === "POST" && req.url === "/v1/chat/completions") {
                return forwardChat(req, res);
              }

              return sendJson(res, 404, { error: { message: "not found" } });
            } catch (err) {
              return sendJson(res, 500, { error: { message: String(err) } });
            }
          });

          server.listen(PORT, "127.0.0.1", () => {
            console.log(`zapi thought injector listening on http://127.0.0.1:${PORT}`);
          });
          EOF

      - name: Start local ZAPI thought injector
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: |
          if [ -z "$ZAPI_API_KEY" ]; then
            echo "Missing ZAPI_API_KEY secret"
            exit 1
          fi

          nohup node "$HOME/zapi-thought-proxy.js" > zapi-proxy.log 2>&1 &

          echo "Waiting for proxy..."
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4010/healthz >/dev/null 2>&1; then
              echo "Proxy is ready"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4010/healthz >/dev/null 2>&1; then
            echo "Proxy failed to start"
            echo "=== zapi-proxy.log ==="
            cat zapi-proxy.log || true
            exit 1
          fi

      - name: Configure OpenCode
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat << 'EOF' > "$HOME/.config/opencode/opencode.json"
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": ["opencode-antigravity-auth@beta"],
            "provider": {
              "zapi": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "ZAPI",
                "options": {
                  "baseURL": "http://127.0.0.1:4010/v1",
                  "apiKey": "sk-local"
                },
                "models": {
                  "gemini-3.1-pro-high": {
                    "name": "Gemini 3.1 Pro High (ZAPI)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  }
                }
              },
              "google": {
                "models": {
                  "antigravity-gemini-3-pro": {
                    "name": "Gemini 3 Pro (Antigravity)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingLevel": "low" },
                      "high": { "thinkingLevel": "high" }
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Initial Startup
        run: |
          nohup stdbuf -oL node "$OPENCHAMBER_CLI" --port 3000 > openchamber.log 2>&1 &

          echo "Waiting for OpenChamber to start..."
          for i in $(seq 1 30); do
            if lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "OpenChamber is listening on port 3000"
              break
            fi
            sleep 2
          done

          if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "OpenChamber failed to start"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            echo "=== zapi-proxy.log ==="
            tail -n 200 zapi-proxy.log || true
            exit 1
          fi

          : > tunnel.log

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
            nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &

            echo "Waiting for ngrok URL..."
            for i in $(seq 1 30); do
              URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "ngrok exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          else
            nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &

            echo "Waiting for Cloudflare URL..."
            for i in $(seq 1 45); do
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
              if [ -n "$URL" ]; then
                echo "URL=$URL" >> "$GITHUB_ENV"
                echo "Tunnel ready: $URL"
                break
              fi

              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "cloudflared exited early"
                echo "=== tunnel.log ==="
                tail -n 200 tunnel.log || true
                exit 1
              fi

              sleep 2
            done
          fi

          if ! grep -q '^URL=' "$GITHUB_ENV"; then
            echo "Tunnel failed to produce a public URL"
            echo "=== openchamber.log ==="
            tail -n 200 openchamber.log || true
            echo "=== tunnel.log ==="
            tail -n 200 tunnel.log || true
            exit 1
          fi

      - name: Monitor & Self-Heal
        run: |
          echo "------------------------------------------"
          echo "SERVER LIVE AT: ${{ env.URL }}"
          echo "AUTO-SHUTDOWN IN: ${{ github.event.inputs.timeout_minutes }} minute(s)"
          echo "All your repos available at: ~/repos/"
          echo "------------------------------------------"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$(( ${{ github.event.inputs.timeout_minutes }} * 60 ))

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( TIMEOUT_SECONDS - ELAPSED ))

            if [ "$REMAINING" -le 0 ]; then
              echo "[$(date)] Timeout reached. Initiating graceful shutdown..."
              pkill -f "openchamber|ngrok|cloudflared|zapi-thought-proxy.js" 2>/dev/null || true
              break
            fi

            if [ $(( ELAPSED % 300 )) -lt 5 ]; then
              echo "[$(date)] Time remaining: $(( REMAINING / 60 )) minutes"
            fi

            if ! lsof -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "[$(date)] Restoring OpenChamber..."
              nohup stdbuf -oL node "$OPENCHAMBER_CLI" --port 3000 >> openchamber.log 2>&1 &
              sleep 10
            fi

            if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
              if ! pgrep -f "ngrok http 3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting ngrok tunnel..."
                : > tunnel.log
                nohup stdbuf -oL ngrok http 3000 --log=stdout > tunnel.log 2>&1 &
                sleep 10
                URL=$(curl -fsSL http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty')
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            else
              if ! pgrep -f "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000" >/dev/null 2>&1; then
                echo "[$(date)] Re-hosting Cloudflare tunnel..."
                : > tunnel.log
                nohup stdbuf -oL cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
                sleep 15
                URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
                [ -n "$URL" ] && echo "NEW LINK: $URL"
              fi
            fi

            tail -n 1 openchamber.log 2>/dev/null || true
            sleep 5
          done

      - name: Prepare Session Data for Save
        if: always()
        run: |
          echo "Preparing session data for persistence..."
          mkdir -p /tmp/opencode-save/config \
                   /tmp/opencode-save/openchamber \
                   /tmp/opencode-save/opencode-worktree \
                   /tmp/opencode-save/project \
                   /tmp/opencode-save/worktree \
                   /tmp/opencode-save/state \
                   /tmp/opencode-save/storage \
                   /tmp/opencode-save/cache \
                   /tmp/opencode-save/log \
                   /tmp/opencode-save/bin

          if [ -d "$HOME/.config/opencode" ] && [ "$(ls -A "$HOME/.config/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode/"* /tmp/opencode-save/config/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.config/openchamber" ] && [ "$(ls -A "$HOME/.config/openchamber" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/openchamber/"* /tmp/opencode-save/openchamber/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.config/opencode-worktree" ] && [ "$(ls -A "$HOME/.config/opencode-worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode-worktree/"* /tmp/opencode-save/opencode-worktree/ 2>/dev/null || true
          fi

          if [ -f "$HOME/.local/share/opencode/auth.json" ]; then
            cp -v "$HOME/.local/share/opencode/auth.json" /tmp/opencode-save/auth.json 2>/dev/null || true
          fi

          if [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            cp -v "$HOME/.local/share/opencode/opencode.db"* /tmp/opencode-save/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/state/opencode" ] && [ "$(ls -A "$HOME/.local/state/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/state/opencode/"* /tmp/opencode-save/state/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/share/opencode/project" ] && [ "$(ls -A "$HOME/.local/share/opencode/project" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/project/"* /tmp/opencode-save/project/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/share/opencode/worktree" ] && [ "$(ls -A "$HOME/.local/share/opencode/worktree" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/worktree/"* /tmp/opencode-save/worktree/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/share/opencode/storage" ] && [ "$(ls -A "$HOME/.local/share/opencode/storage" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/storage/"* /tmp/opencode-save/storage/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.cache/opencode" ] && [ "$(ls -A "$HOME/.cache/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.cache/opencode/"* /tmp/opencode-save/cache/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/share/opencode/log" ] && [ "$(ls -A "$HOME/.local/share/opencode/log" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/log/"* /tmp/opencode-save/log/ 2>/dev/null || true
          fi

          if [ -d "$HOME/.local/share/opencode/bin" ] && [ "$(ls -A "$HOME/.local/share/opencode/bin" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/bin/"* /tmp/opencode-save/bin/ 2>/dev/null || true
          fi

          if [ "$(find /tmp/opencode-save -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            ls -la /tmp/opencode-save/
          else
            echo "$(date): No session data available" > /tmp/opencode-save/placeholder.txt
          fi

      - name: Upload Session Data (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session
          path: /tmp/opencode-save/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
